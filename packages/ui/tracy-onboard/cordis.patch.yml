# Insert the plugin's row. Whatever bundle loads this package puts that row into the loader tree.
#
# This row does NOT run when a profile loads `@tracy/dsh-native-bundle`: a package's patch applies
# only when that package itself is named in `dsh.profile.bundles`. Listing BOTH the bundle and this
# package in one profile inserts the row twice, so the id collides and dsh REFUSES TO BOOT.
#
# The native bundle inserts it ENABLED, for the web and the desktop app alike (ADR 0030): on the web
# the account decides (`GET /api/onboarding`), in the app this device does; no answer = no screen.
- insert:
    - id: tracy-onboard
      name: '@tracy/dsh-onboard'
