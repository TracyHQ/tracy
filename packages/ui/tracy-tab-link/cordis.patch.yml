# Insert this plugin's row. Whichever bundle loads this package puts the row in the loader tree.
#
# 🔒 This row does NOT run when a profile loads a Tracy bundle: a package's own patch only applies
# when that package is named in `dsh.profile.bundles`. Listing BOTH the bundle AND this package in
# one profile inserts the row twice → duplicate id → dsh REFUSES TO BOOT.
- insert:
    - id: tracy-tab-link
      name: '@tracy/dsh-tab-link'
