# docker-proxy — the docker API, narrowed to `docker exec` into a site's web container.
#
# Mounted read-only at /usr/local/etc/haproxy/haproxy.cfg by host-dsh.yml. It is the WHOLE
# boundary between the dsh container and the host's docker daemon: dsh talks to
# tcp://docker-proxy:2375 and never sees /var/run/docker.sock.
#
# ## Why our own config and not tecnativa/docker-socket-proxy's switches
#
# That image's rules are per API PREFIX. Measured 06/09/2026: `CONTAINERS=1` (which `docker exec`
# needs, for POST /containers/<id>/exec) also allows POST /containers/create — so a caller could
# start a privileged container bind-mounting the host's `/`. Through that proxy,
# `docker run --rm -v /:/host:ro alpine ls /host` WORKED. `ALLOW_START=0` does not help; it is
# only consulted when CONTAINERS=0. A prefix switch cannot express "exec, but only exec, and only
# into that container", which is exactly the sentence this file has to say.
#
# ## The rule, in one line
#
# ALLOW exactly the seven requests the docker CLI makes for
# `docker exec [-i|-it] [-u …] [-w …] [-e …] <name> <cmd>`, and only when <name> is a site's web
# container. DENY everything else, including every other verb on the same container.
#
# Discovered by measurement, not from documentation: the CLI was run through this proxy and
# haproxy's own httplog read back. The table is in HOST-DSH.md §5.
#
# ## What it still does NOT stop — read this before quoting the file above
#
# THIS FILTERS THE PATH. IT DOES NOT FILTER THE BODY. `POST /containers/<x>-web-1/exec` carries a
# JSON document, and haproxy has no opinion about it, so `{"Privileged":true,"User":"0"}` is
# allowed by every rule here. Measured 06/09/2026 through this exact config: exec-create 201,
# exec-start 200, and the command ran as uid 0 with CapEff 000001ffffffffff — every capability —
# inside the site's web container. A normal exec came back uid 33, CapEff 0000000000000000.
#
# So what this file bounds is WHICH CONTAINER, not who the exec runs as or what it may do once
# inside. Saying it bounds "the web container's user" — as an earlier version of this comment did
# — is wrong, and wrong in the direction that makes someone stop looking.
#
# 🔒 THE SECOND BOUNDARY IS THE WEB CONTAINER'S OWN CONFINEMENT. In the same measurement the escape
# attempt failed (`mount` denied, no block device in /dev) — because that container was running
# Docker's DEFAULT seccomp/AppArmor profile. That profile is now load-bearing for the host, so it
# is pinned rather than assumed:
#
#   · scripts/provision/render-compose.sh writes `security_opt: ["no-new-privileges:true"]` on
#     every web service (it does NOT close this gap — a privileged exec into a container started
#     with the flag still gets every capability, measured — it closes the ordinary setuid one);
#   · scripts/provision/attach-site.sh REFUSES to attach a site whose `<label>-web-1` runs
#     --privileged or with seccomp/apparmor unconfined, so a site that lost the profile never
#     becomes reachable from the agent's shell;
#   · HOST-DSH.md §5 carries the one-line sweep to run across every site before a migration.
#
# What is genuinely intended, and stays: the agent can run commands inside the SITE'S OWN web
# container. That is the shell Tracy gives the site's agent, and the seat door decides who gets
# one. What this file buys is that a compromised dsh cannot touch any OTHER container, cannot
# create one, and cannot reach the rest of the daemon's API.

global
    log stdout format raw daemon info
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    retries 3
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    # `docker exec` hijacks the connection: after 101/200 the stream is the command's stdio, and
    # an agent command may run for hours with nothing on the wire. `timeout tunnel` is the one
    # that governs an upgraded connection — `timeout server` would cut a quiet build at ten
    # minutes, and the symptom is a tool that reports failure on a command that succeeded.
    timeout tunnel 12h
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind :2375

    # ── Three shapes of request, and nothing else ────────────────────────────────────────────
    #
    # ⚠ THE API PREFIX IS OPTIONAL IN EVERY REGEX. The docker CLI negotiates a version and then
    # prefixes every path with /v1.51 (or whatever it settled on) — measured, not assumed. A rule
    # written without `(/v[0-9]+\.[0-9]+)?` matches nothing the CLI actually sends, and the
    # failure is a 403 on a request that SHOULD have been allowed: it reads like a broken proxy
    # rather than a missing prefix.
    #
    # ⚠ THE PATH IS URL-DECODED BEFORE MATCHING, and every regex is anchored at both ends.
    # /containers/%2e%2e%2fbuild/exec decodes to /containers/../build/exec, matches nothing, and
    # falls to the deny at the bottom. Fail-closed is the shape: a request nobody wrote a rule
    # for is refused, never forwarded to find out.
    #
    # ⚠ NO `-i`. Container names are matched case-SENSITIVELY, because `fleetLabel()`
    # (workers/seat-registry/src/fleet.js) only ever produces `[a-z0-9-]` starting with
    # `[a-z0-9]`. With `-i` an operator's container named `Foo-WEB-1` would be exec-able;
    # measured on 06/09, `POST /containers/WPDEMO-WEB-1/exec` reached the daemon before the flag
    # came off.

    # The version handshake the CLI does before anything else: HEAD /_ping, and GET /version.
    # Neither names a container and neither changes anything.
    acl handshake      path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version)$

    # The container a command may be run in. `<label>-web-1` is what compose names a site's web
    # service (render-compose.sh writes the service as `web`, the project as the site label), so
    # this regex IS the naming convention — written down where it is enforced rather than
    # trusted. It excludes, by construction: `tracy-dsh` (this host's own dsh; an exec into it
    # would be an escape from the seat door into the process that enforces it), `<label>-db-1`
    # (where a dump is one command away), `tracy-docker-proxy` (this container), and every
    # container an operator started by hand.
    acl path_inspect     path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-z0-9][a-z0-9-]*-web-1/json$
    acl path_exec_create path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-z0-9][a-z0-9-]*-web-1/exec$

    # The exec session, once created. Its id is the daemon's 64-hex — measured. Pinning the
    # length rather than accepting any word is one more thing a caller cannot invent; if a future
    # daemon ever changes the format the symptom is loud (403 on `/exec/<id>/start`, every
    # command fails at once) and the fix is this number.
    acl path_exec_start  path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/exec/[a-f0-9]{64}/start$
    acl path_exec_resize path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/exec/[a-f0-9]{64}/resize$
    acl path_exec_json   path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/exec/[a-f0-9]{64}/json$
    # A site's owner may restart their own web container (site.restart / site.rebuild in the Build
    # plugin): the process is PID 1, so nothing inside the container can bring it back up.
    acl path_restart     path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-z0-9][a-z0-9-]*-web-1/restart$

    # ── The verb ─────────────────────────────────────────────────────────────────────────────
    #
    # Split from the path on purpose. GET /containers/<web>/json is an inspect and is fine;
    # POST /containers/<web>/json is not a thing, and a rule that only looked at the path would
    # forward it to the daemon to find out.
    acl method_read  method GET
    acl method_read  method HEAD
    acl method_write method POST

    # Seven allows, then a deny. Nothing reaches the socket without a line naming it.
    http-request allow if handshake        method_read
    http-request allow if path_inspect     method_read
    http-request allow if path_exec_create method_write
    http-request allow if path_exec_start  method_write
    http-request allow if path_exec_resize method_write
    http-request allow if path_exec_json   method_read
    http-request allow if path_restart     method_write
    http-request deny

    default_backend dockerbackend
