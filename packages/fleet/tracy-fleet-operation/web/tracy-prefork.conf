# Tracy: a customer site's Apache child is replaced after a bounded number of connections.
#
# The php images run prefork + mod_php with MaxConnectionsPerChild 0, so a child is never
# replaced and whatever a heavy request grew (PHP's allocator keeps freed memory) stays for the
# life of the container. Measured on a real host (16/11/2026): one site held 550 MiB, 11 children
# alive for 20 days, three at ~180 MB RSS, for 168 requests a day.
#
# 100, not 1000: a connection counts once however many keep-alive requests ride on it
# (MaxKeepAliveRequests 100), a browser opens about six per page, and a quiet site makes few, so a
# larger number is never reached and changes nothing. A fork is cheap here: opcache is shared
# memory, so a new child starts warm. A busy site at 5 connections/s over ~10 children replaces
# one every ~20 s, which costs nothing measurable.
#
# The other prefork values stay the image defaults: a customer site has visitors.
# A demo's own file (zz-tracy-demo-limits.conf, scripts/provision/render-compose.sh) is loaded
# after this one, because conf-enabled is read in name order, and keeps its 500.
<IfModule mpm_prefork_module>
    MaxConnectionsPerChild  100
</IfModule>
