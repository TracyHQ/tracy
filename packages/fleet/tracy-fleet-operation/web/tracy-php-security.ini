; PHP hardening every PHP site image carries (web/joomla.Dockerfile, web/wordpress.Dockerfile,
; web/demos.Dockerfile). Hashed into the image label by web/build.sh (PHP_FILES): a change here is a
; new tag in IMAGE_TAGS / DEMOS_IMAGE, never a relabel.
;
; session.upload_progress lets ANY multipart request write into the session store before a line of
; the site's code runs (PHP_SESSION_UPLOAD_PROGRESS). It is the easiest pre-auth path into
; CVE-2026-126714 (partially overwritten session files -> RCE) and a precondition of CVE-2026-115560
; (session serializer mismatch -> RCE), both fixed in PHP 8.2.36 / 8.3.37 / 8.4.28 (19 Nov 2026).
; PHP's own advice is to turn it off; the fixed releases default it off too. Joomla and WordPress
; never read it. Kept here, not only relied on from the base, so an older or re-pinned base stays closed.
session.upload_progress.enabled = 0
