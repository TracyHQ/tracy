# The demo farm's Apache (web/demos.Dockerfile). The server-wide part of what the per-demo
# apache images run, then every folded demo's vhost (scripts/lib/demo-farm.sh).

ServerName tracy-demos

# As in the php:*-apache images (conf-enabled/docker-php.conf, remoteip.conf).
DirectoryIndex disabled
DirectoryIndex index.php index.html
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
RemoteIPInternalProxy 169.254.0.0/16
RemoteIPInternalProxy 127.0.0.0/8

# Logs to the container's own streams, as the apache images do.
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 vhost_combined
LogLevel warn

# One event MPM for every demo. A thread costs a few hundred KiB, not a prefork process each: the
# measured per-demo prefork pool was ~27 MiB anonymous per demo.
<IfModule mpm_event_module>
    StartServers             1
    ServerLimit              4
    ThreadsPerChild          25
    MinSpareThreads          10
    MaxSpareThreads          50
    MaxRequestWorkers        100
    MaxConnectionsPerChild   0
</IfModule>
KeepAliveTimeout 2

# Demo docroots live under /site/<label>/.webroot (the same path the per-demo containers mount the
# webroot at beside /var/www/html). Nothing outside a demo's own vhost may serve them.
<Directory /site/>
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

# The health and default port: no demo is ever served here.
<VirtualHost *:8080>
    ServerName tracy-demos
    DocumentRoot /var/www/empty
    <Directory /var/www/empty>
        Require all denied
    </Directory>
    <Location /fpm-ping>
        Require ip 127.0.0.1
        SetHandler "proxy:unix:/run/tracy-demos/_farm.sock|fcgi://tracy-farm-health/"
    </Location>
</VirtualHost>

IncludeOptional /etc/tracy-demos/apache/*.conf
