; The demo farm's php-fpm (web/demos.Dockerfile). Global settings, the farm's own health pool,
; and the include of every demo's pool (scripts/lib/demo-farm.sh `tracy_farm_render_pool`).
[global]
pid = /run/php-fpm.pid
error_log = /proc/self/fd/2
log_limit = 8192
; A demo's pool may never take the farm down with it: a crashing child is restarted, and ten
; crashes in a minute restart the master rather than leave every demo answering 503.
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s
; The farm-wide ceiling of PHP workers across every pool (each pool's own is pm.max_children = 4).
process.max = 64
include = /etc/tracy-demos/fpm/*.conf

; The farm's own pool: answers /fpm-ping for the health check, and nothing else.
[_farm]
user = www-data
group = www-data
listen = /run/tracy-demos/_farm.sock
; Apache's own user alone may connect (demos.Dockerfile: no pool's worker can).
listen.owner = farmhttp
listen.group = farmhttp
listen.mode = 0600
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s
ping.path = /fpm-ping
pm.status_path = /fpm-status
