; The demo farm's PHP (web/demos.Dockerfile). The error logging and expose_php of the per-demo
; images come with the base image's conf.d (error-logging.ini, expose-php.ini); what is here is
; what differs because one PHP now serves every folded demo on the host.
;
; ONE OPcache for the farm. Measured per demo (13/11/2026): 20 MiB of shared memory right after
; start, growing to 100-128 MiB of which only ~30-33 MiB was live — the rest wasted on recompiled
; scripts, with an OOM restart. Here the farm's pools share one arena under one master: 256 MiB for
; ~44 demos, and a file cache on a farm volume so a reload (which drops the arena) recompiles from
; disk, not from source.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 60000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
opcache.file_cache = /var/cache/opcache
; Every pool runs as www-data; these keep one demo's cached script from being served for another
; demo's path, and refuse a script the requesting pool could not read itself.
opcache.validate_root = 1
opcache.validate_permission = 1
opcache.revalidate_path = 1

; APCu had a 32M segment and zero entries on every measured demo: unused. The farm keeps the
; extension loaded (a demo that probes for it still finds it) with a small segment.
apc.shm_size = 8M

; Same as the apache images: errors go to the container log, not to the page.
error_log = /proc/self/fd/2
