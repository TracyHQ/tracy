# Insert Tracy's de/fr/it/nl/zh dictionaries; the user patch then only ever modifies this row.
#
# `- insert:` and not a bare `- id:` row: a bare row only MODIFIES an existing entry, so a
# plugin that is not in the profile yet is silently skipped. See docs/references/dsh-plugin.md §1.
- insert:
    - id: tracy-locales
      name: '@tracy/dsh-tracy-locales'
