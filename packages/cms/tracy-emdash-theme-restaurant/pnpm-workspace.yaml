# Marker: this template is a standalone pnpm project (its own lockfile).
packages: []
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  "@parcel/watcher": true
minimumReleaseAgeExclude:
  - '@emdash-cms/admin@1.1.0'
  - '@emdash-cms/auth@1.1.0'
  - '@emdash-cms/blocks@1.1.0'
  - '@emdash-cms/gutenberg-to-portable-text@1.1.0'
  - '@emdash-cms/plugin-audit-log@0.2.3'
  - '@emdash-cms/plugin-forms@0.2.9'
  - emdash@1.1.0
# Every zod below 4.6.6 has GHSA-mrhx-c7xc-m3w5 (memory exhaustion on oversized constrained
# collections) and 3.x has no patched release, so all of them resolve to 4.6.6.
overrides:
  'zod@<4.6.6': 4.6.6
