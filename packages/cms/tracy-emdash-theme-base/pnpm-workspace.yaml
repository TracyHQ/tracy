# Marker: this template is a standalone pnpm project (its own lockfile).
packages: []
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  "@parcel/watcher": true
minimumReleaseAgeExclude:
  - '@emdash-cms/admin@1.1.0'
  - '@emdash-cms/auth@1.1.0'
  - '@emdash-cms/blocks@1.1.0'
  - '@emdash-cms/gutenberg-to-portable-text@1.1.0'
  - '@emdash-cms/plugin-audit-log@0.2.3'
  - '@emdash-cms/plugin-forms@0.2.9'
  - emdash@1.1.0
# Every zod below 4.6.6 has GHSA-mrhx-c7xc-m3w5 (memory exhaustion on oversized constrained
# collections) and 3.x has no patched release, so all of them resolve to 4.6.6: emdash 1.1.0
# pins 4.5.4, astro 7.3.3 asks ^4.5.4, the dev-only shadcn CLI asks ^3.24.1.
overrides:
  'zod@<4.6.6': 4.6.6
# body-parser 2.0.0 to 2.3.x has GHSA-27r3-jxmh-p828 (denial of service via trailing bytes after a
# compressed request body); 2.4.0 is the first patched release.
  "body-parser@>=2.0.0 <2.4.0": 2.4.0
# nodemailer below 10.1.4: GHSA-rcmh-qjqh-p98v, GHSA-p6gq-j5cr-w38f, GHSA-2x7j-588g-ccc2, GHSA-v53p-9fqp-m79j, GHSA-r7g4-qg5f-qqm2 (high) and 17 moderate or low ones; 10.1.4 clears every one.
  "nodemailer@<10.1.4": 10.1.4
# Dependency review round 3: the patched release inside the same major, one advisory per line.
# @hono/node-server 1.19.10 to 2.1.2: GHSA-rmxm-3fg6-px4f.
  "@hono/node-server@>=2.0.0 <2.1.3": 2.1.3
# @vitest/mocker below 4.1.12: GHSA-qxg6-89mg-rqv8, GHSA-xp26-3454-mjgp.
  "@vitest/mocker@<4.1.12": 4.1.12
# fast-uri below 3.1.9: GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h, GHSA-wjr9-j795-jxcr.
  "fast-uri@>=3.0.0 <3.1.9": 3.1.9
# hono 4.12.4 to 4.13.10: GHSA-5r4p-p66f-jhc7.
  "hono@>=4.12.4 <4.13.11": 4.13.11
# minimatch below 11.0.1: GHSA-g3hv-75wg-m249 (the only fix is 11.x; no 10.x release is patched).
  "minimatch@>=10.0.0 <11.0.1": 11.0.1
# qs 6.7.0 to 6.16.0: GHSA-6pq8-jhm2-2vcw.
  "qs@>=6.7.0 <6.16.1": 6.16.1
# sanitize-html below 2.18.1: GHSA-cv27-6wvh-8x7j, GHSA-x3q4-9hxx-gx8m, GHSA-374f-7chj-9948, GHSA-c9rx-x947-fp3h.
  "sanitize-html@<2.18.1": 2.18.1
# seroval below 1.6.11: GHSA-97r2-qh9m-474h, GHSA-wp97-x4hv-qvhp, GHSA-7rv5-mrxv-xcr9, GHSA-9wx9-5pv9-3349, GHSA-f86p-h4j2-7qgj.
  "seroval@<1.6.11": 1.6.11
# systeminformation below 5.33.16: GHSA-3f7j-7jwc-fxfj (high), GHSA-7648-jmwf-vw7j, GHSA-4vjg-vx72-qq4g.
  "systeminformation@<5.33.16": 5.33.16
# undici 7.x below 7.30.1 and 8.x below 8.12.2: GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm (high) and four moderate ones.
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "undici@>=8.0.0 <8.12.2": 8.12.2
# vite 8.3.0 to 8.3.2: GHSA-587h-7wmj-h5pm (high) and five moderate or low ones.
  "vite@>=8.3.0 <8.3.3": 8.3.3
# deepmerge 4.2.0 to 4.3.1 has GHSA-gcqx-w48m-w2h4 (prototype poisoning in mergeObject) and no patched
# release; only the shadcn CLI (a dev tool for adding UI primitives) uses it, so it takes 4.1.1, the last
# release before the affected range.
  "deepmerge@>=4.2.0 <=4.3.1": 4.1.1
