<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example Bistro menu tabs</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .dishes { display: flex; flex-wrap: wrap; }
  .dish { width: 100%; height: 60px; box-sizing: border-box; padding: 8px; }
</style>
</head>
<body>
<!-- Fabricated: a menu block with two tabs; the dessert rows sit in the tab that is closed when the page opens. -->
<div id="Mod52" class="moduletable">
  <ul class="nav"><li><a href="#starters">Starters</a></li><li><a href="#desserts">Desserts</a></li></ul>
  <div class="tab-content">
    <div class="tab-pane active" id="starters"><div class="dishes"><div class="dish">Soup</div></div></div>
    <div class="tab-pane" id="desserts"><div class="dishes">
      <div class="dish">Tart</div><div class="dish">Sorbet</div><div class="dish">Pie</div><div class="dish">Cake</div>
    </div></div>
  </div>
</div>
<script>
  for (const a of document.querySelectorAll('.nav a'))
    a.addEventListener('click', (e) => {
      e.preventDefault()
      for (const p of document.querySelectorAll('.tab-pane')) p.classList.toggle('active', '#' + p.id === a.getAttribute('href'))
    })
</script>
</body>
</html>
