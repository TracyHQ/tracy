<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example Climbing Hall coaches</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  .acm-cards h2, .acm-cards .more { text-align: center; }
  .row { display: flex; flex-wrap: wrap; justify-content: flex-start; }
  .card-col { width: 25%; box-sizing: border-box; padding: 8px; }
  .card-col .card { height: 160px; background: #ccd; }
</style>
</head>
<body>
<!-- Fabricated: a heading and a button centered, four cards packed from the left. -->
<div id="Mod40" class="moduletable">
  <div class="acm-cards style-2">
    <h2>Our coaches</h2>
    <div class="row cards">
      <div class="card-col"><div class="card">Coach A</div></div>
      <div class="card-col"><div class="card">Coach B</div></div>
      <div class="card-col"><div class="card">Coach C</div></div>
      <div class="card-col"><div class="card">Coach D</div></div>
    </div>
    <p class="more"><a href="#">All coaches</a></p>
  </div>
</div>
</body>
</html>
