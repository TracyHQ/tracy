# A local WordPress stand to restore a published quickstart onto, so the release scripts beside
# this file can read and change it. Driven by restore-release.mjs, which sets the three variables:
#   STAND_DIR      host folder holding the webroot (never inside the repo)
#   STAND_PORT     loopback port the site answers on
#   STAND_DB_PASSWORD  root password of the stand's own database (local only)
#   STAND_WEBROOT  optional: `restore` serves the project's restore volume (stand.mjs restoreVolume)
#                  instead of the host folder, as pack-and-verify.mjs does for its verify stand
# The `cli` service is the wp-cli runner the release scripts use
# (`docker compose … run --rm -T cli <wp args>`); it mounts the same webroot as `web`.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${STAND_DB_PASSWORD}
      MARIADB_DATABASE: wp
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 60
  web:
    image: wordpress:apache
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:${STAND_PORT}:80']
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ${STAND_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp
      WORDPRESS_TABLE_PREFIX: tr_
    volumes: ['${STAND_WEBROOT:-${STAND_DIR}/webroot}:/var/www/html']
  cli:
    image: wordpress:cli-php8.3
    entrypoint: ['wp']
    user: '33:33'
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ${STAND_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp
    volumes: ['${STAND_WEBROOT:-${STAND_DIR}/webroot}:/var/www/html']
volumes:
  restore: {}
