<!doctype html>
<!--
  The blocked screen (tasks/todo-desktop-update-policy.md C7): shown instead of the product when this
  copy is below the minimum version the signed feed sets. A local page of the shell, like
  signin-waiting.html: no remote content, a strict CSP, text only. Its words come from the main
  process in the system's language (src/shell-strings.js) through its own preload
  (src/blocked-preload.js) — the product bridge is not here.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tracy Cowork</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1f23;
        --fg: #eceff1;
        --muted: #a3acb5;
        --line: #343a40;
        --accent: #bf5b3d;
        --warn: #d9a441;
        --error: #e5675a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-app-region: drag;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
        text-align: center;
        -webkit-app-region: no-drag;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.375rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      #status {
        padding: 0.625rem 0.875rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--fg);
      }
      #status:empty {
        display: none;
      }
      #status[data-tone="warn"] {
        border-color: var(--warn);
      }
      #status[data-tone="error"] {
        border-color: var(--error);
      }
      #buttons {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
      }
      button {
        font: inherit;
        padding: 0.5rem 1.125rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button[data-primary="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="body"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="buttons"></div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
