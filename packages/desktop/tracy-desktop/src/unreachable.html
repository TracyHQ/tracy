<!doctype html>
<!--
  Shown in a product window whose page could not load — offline, the server down, a name that does
  not resolve — instead of Chromium's blank error page (src/load-failure.js decides when). A local
  page of the shell, like blocked.html and signin-waiting.html: no remote content, a strict CSP, text
  only. The main process loads it with the words in the system's language, the address Retry goes
  back to and Chromium's error name, in the query string; the script below only copies them in.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tracy Cowork</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1f23;
        --fg: #eceff1;
        --muted: #a3acb5;
        --line: #343a40;
        --accent: #bf5b3d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-app-region: drag;
      }
      [hidden] {
        display: none !important;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
        text-align: center;
        -webkit-app-region: no-drag;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.375rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      #detail {
        font-size: 0.8125rem;
      }
      #retry {
        display: inline-block;
        font: inherit;
        padding: 0.5rem 1.125rem;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title" data-t="unreachable.title">Can’t connect</h1>
      <p data-t="unreachable.body">Tracy Cowork can’t reach its server. Check your internet connection, then retry.</p>
      <p id="detail" data-t="unreachable.detail" hidden></p>
      <a id="retry" href="#" data-t="unreachable.retry" hidden>Retry</a>
    </main>
    <script src="unreachable.js"></script>
  </body>
</html>
