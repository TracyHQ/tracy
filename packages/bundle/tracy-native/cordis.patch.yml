    # ── Matt Skills Deck: REMOVED 06/09/2026 (it was never usable) ──────────────
    #
    # From 05/09 to 06/09 the `dsh-mattpocock-skills-deck` row stood here: FeatherHunter's issue board in
    # the sidebar, reading GitHub through `gh`, which the image did not have installed, so on the lane it
