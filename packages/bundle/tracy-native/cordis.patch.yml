# `@tracy/dsh-native-bundle` — Tracy's layer for the profile where **dsh is the shell**.
#
# Three bundles, three shapes, and the difference between them is NOT taste:
#
#   @tracy/dsh-cowork-bundle  dsh is a SIDECAR in the Tracy shell's `/agent` iframe (profiles `web`,
#                             `desktop`). The shell already has its own navigation, so that bundle
#                             TURNS OFF `ui-sidebar` — two stacked navigation layers were measured
#                             on 30/08: two Settings on one screen.
#   @tracy/dsh-native-bundle  dsh IS the shell (profile `native`). There is no other shell to hand
#                             navigation to, so the left column MUST live — since 03/09 drawn by
#                             `@tracy/dsh-sidebar`, with dsh's `ui-sidebar` standing down.
#
# 🔒 WHY NOT REUSE `@tracy/dsh-cowork-bundle` AND TURN `ui-sidebar` BACK ON IN THE PROFILE.
# It really is cheaper — no copying the three `dsh-passwords` rows a third time. But "the upper layer turns
# back on what the lower layer just turned off" puts one decision in two opposing places, and the second
# place does not say why. The next person editing the sidecar bundle would not know a profile is fighting it.
#
# ⚠ THIS IS A CUSTOMER SURFACE (Site Admin role, decided 31/08), not an internal operations door.
# An operations team needing the full UI uses this profile too; but its design must assume the person
# looking is a **customer**, not the person who wrote it.

# ── dsh-passwords ──────────────────────────────────────────────────────────────
# Copied from its own `cordis.yml`, for the THIRD TIME in this repo — dsh has no bundle-in-bundle
# mechanism: `DshBundleManifest` carries exactly one `patch` and nothing else.
#
# THE PIN IN package.json IS WHAT KEEPS THESE THREE ROWS FROM DRIFTING. `2.6.6-tracy.2` is an exact
# number, not a caret: a new version landing with rows that no longer match would say nothing.
# Upgrading is a deliberate change, and whoever does it must reread the upstream `cordis.yml`.
#
# dsh ships a self-adapting directory picker: it resolves to the browser's native dialog when bound to
# loopback with a display session, then breaks whenever the app is reached through the gateway. Pin the
# in-app version, explicitly.
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    # No `ui-directory-picker-browse` (15/09/2026): a workspace is a site, and a site is added by Add
    # site, never by picking a folder. With the directory-flow hole empty, dsh hides "Add workspace…"
    # in the sidebar and in the conversation hero picker.

    - id: dsh-passwords
      name: dsh-passwords

# ── Tracy ──────────────────────────────────────────────────────────────────────
- insert:
    - id: tracy-brand
      name: '@tracy/dsh-brand'

    # Tracy's left column — a frame following the design bench's `Rail`, with dsh's session tree still
    # inside. It takes the `sidebar` slot and REDECLARES five child slots, so `ui-sidebar` must be off (last
    # block of the file): both sides declaring the same child slot throws at registration.
    - id: tracy-sidebar
      name: '@tracy/dsh-sidebar'

    # dsh's OWN namespace, translated by the community. This package OWNS the `vi` language — it is the
    # only place that calls `addLanguage`. `@tracy/dsh-tracy-locale-vi` below carries only Tracy's own
    # namespace: calling `addLanguage` a second time on the same id throws at registration and brings down
    # the whole plugin tree.
    #
    # 🔒 npmjs has a DIFFERENT package also named `dsh-locale-vi@0.1.0` — different author, different
    # content. And TCH's `.npmrc` sends UNSCOPED packages straight to npmjs. Keep the pinned `-tracy.N` version.
    - id: dsh-locale-vi
      name: dsh-locale-vi

    # The four European languages Tracy supports beyond dsh's built-ins (de, fr, it, nl), registered
    # through dsh's native `locale.addLanguage`. The fork registers ONLY the languages listed in
    # `@tracy/core/interface-languages` (spec #730, 02/10/2026); the other 14 dictionaries stay in
    # the tree unreferenced. A registered language is selectable and can win browser detection, so
    # an untranslated one must not be registered. Pinned by
    # `packages/core/tracy-core/test/interface-languages.test.mjs`.
    #
    # 🔒 NO `vi` HERE, and that is why this package must be a fork rather than the upstream build used
    # directly: `dsh-locale-vi` just above already holds the id `vi`, and `addLanguage` with a duplicate id
    # THROWS — and in dsh that brings down the whole plugin tree, not just this package. Details in
    # `vendor/tracy/dsh-better-locale/src/client/languages.ts`.
    #
    # ⚠ The package README is upstream's text and still lists 19 languages; `languages.ts` in the
    # subtree is the evidence of what registers.
    #
    # 🔒 ONE ROW, NOT TWO. Until 01/09 this file listed that package TWICE under the same id — a leftover
    # of merging PR #4, where the new 18-language block sat beside the old 15-language block describing the
    # same package. The consequence was not a warning: dsh **refuses to boot** with `duplicate loader entry
    # id`, so `@tracy/dsh-native-bundle@0.7.13→0.7.15` are three versions no profile could load. It slipped
    # through because all three were published before anyone booted `native` once.
    - id: dsh-plugin-better-locale
      name: '@huanlin/dsh-plugin-better-locale'

    - id: tracy-locale-vi
      name: '@tracy/dsh-tracy-locale-vi'

    # Tracy's own namespaces in de, fr, it, nl, zh and es, plus the dsh namespaces no language pack
