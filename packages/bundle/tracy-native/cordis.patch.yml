# ── Left column: Tracy's frame replaces dsh's frame (03/09/2026) ──────────────
# Until 03/09 this block said "`ui-sidebar` — NOT turned off", because in `native` dsh is the shell and
# there is no other shell to hand navigation to. That is still true — the left column must still live —
# only now the one DRAWING it is `@tracy/dsh-sidebar` (the insert block above). The same way
# `@tracy/dsh-settings` replaces `ui-settings-general`: both sides register the same `single` slot and
# declare the same child slots, so dsh's one must stand down. The workspace tree, session list, Settings
# button and branding are still the old occupants — they register into child slots, not into `sidebar`.
- id: ui-sidebar
  disabled: true

# dsh ships its own experimental right Sidebar — a docking frame (`ui-sidebar-right`) and its
# tab types (`ui-sidebar-documentpreview` — `ui-sidebar-textpreview` until 0.1.5 —,
# `ui-sidebar-files`, and `ui-sidebar-terminal` since 0.1.6), all in the `web-app` bundle by
# default. Tracy's side card is `dsh-better-sidebar`, which already covers files, editor,
# terminal, git, browser and the side chat.
#
# 🔒 THE FRAME STAYS ON SINCE dsh 0.1.6, AND IT IS NOT A PREFERENCE. Upstream `11d6bd05`
# (10/09) made `ui-skill` and `ui-reference` — the `/` skill picker and the `@` file reference in
# the composer — inject `sidebarRight`. With the frame disabled those two never activate, and
# app-boot stops the WHOLE client: measured 16/09 on `cowork.tracy.site`, "web boot: 2 entries
# did not activate … waiting for service: sidebarRight", with the failure card laid out 0×0 — so
# the surface reads as a BLACK page, and the console says nothing at all. `check-boot-graph` does
# not see it either: it asks whether the graph is empty and whether the Tracy plugins are there,
# not whether an entry is stuck pending.
#
# `ui-sidebar-documentpreview` comes back with it, because it is the tab type those two open:
# it claims session file addresses (`ui-sidebar-documentpreview/src/client/definition.ts:51`),
# and with no type registered the registry throws `no registered tab type claims …` on the
# click instead.
#
# The other two stay down. `ui-sidebar-files` and `ui-sidebar-terminal` are the File tree and the
# Terminal that better-sidebar already holds — they are what would make one session read as
# having TWO right sidebars. The frame itself opens CLOSED: until something calls `openResource`
# the only thing it adds is an expand button in the session header corner.
# `terminal-controller` (the host half the terminal tab talks to) stays: it is an API row, not a
# surface.
- id: ui-sidebar-files
  disabled: true
- id: ui-sidebar-terminal
  disabled: true

# Tracy users do NOT choose a session's permission level — the system chooses for them, and that level is
# `workspace-write` (dsh's own default, `interaction/permission-presets/src/index.ts`: write inside the
# workspace, ask for anything wider). Decided 24/09/2026.
#
# `ui-permission` draws exactly three things, and all three go together when this row stands down: the
# "Access mode" chip in the chat box (slot `conversation.input.permission`), a Settings line setting the
# default for the next session, and the popup layer of the `/permission` command. Dropping the chip while
# keeping the other two would leave two other doors to exactly the choice just put away.
#
# SAFE TO TURN OFF, quite unlike `ui-sidebar-right` in the block above: no other package lists
# `dsh-client-ui-permission-presets`, the only service it asks for (`remote.permissionPresets`) is asked
# for by itself alone, and `InputBar.tsx` calls that slot through `renderSlot` — with nobody registered
# the chat box draws an empty spot, not an error. The permission level is still decided by the host as
# before: what stands down is the choosing surface, not the mechanism.
#
# ⚠ The host's `/permission <preset>` command CAN STILL BE TYPED — it is a row in the host's catalog, not
# this row's. Locking it fully must happen in the host, and that is a separate job.
- id: ui-permission
  disabled: true

# ── Approvals: decided at once, never left waiting (29/09/2026) ───────────────
# dsh-base pins `approval: ask` on every new session: an action that needs a human decision — a
# `bash`/`pwsh` command or a file write retried with `sandbox_permissions`, or a
# `tools/pre-execute` "ask" — waits for a browser to answer it, with no timeout. No seat can:
# `dsh-passwords` forwards no approval frame to a seat (`src/gateway.ts`, the `$events` filter).
# Measured on the bench (EmDash V6-des-L5-02, 29/09): one `bash` asking for `danger-full-access`
# held the turn 643 s, until the runner stopped it. The escalation would have bought nothing
# either: the command runs in the site's container as `www-data` in `workspace-write` and
# `danger-full-access` alike (`@tracy/dsh-subprocess-docker`, `EXEC_USER`).
#
# So every preset says `approval: never`, and so does the service's own default. `never` is dsh's
# deterministic headless stance (`interaction/user-approval/src/index.ts`): an ask resolves
# `rejected` before any answerer is asked, and the model's runtime context says "do not request
# sandbox escalation". The sandbox MODE does not move: `workspace-write` stays the default chosen
# above, and `read-only` stays what `dsh-passwords` lowers a visitor seat to. A `/permission` typed
# at the host (see above) now only moves the mode: no preset left in the table asks.
#
# 🔒 BOTH ROWS, TOGETHER. A new session is pinned its default PRESET's bundle, not the service
# default (`permission-presets` `pinInitialPermission`): `approval: never` alone would still pin
# `ask` through the `workspace-write` preset, and with no preset matching the composed defaults
# (`workspace-write` + `never`) the permission service throws at boot. A patch by id replaces the
# row's whole config, so the table is restated whole: dsh-base's three names (`dsh-passwords`
# ranks a seat's switch by them), each with its own sandbox mode. `check-image-profile` holds both
# rows, and the Dockerfile asserts them on the composed tree.
#
# A session created before these rows keeps the `ask` it was pinned — a policy lives in the
# session's own log. `@tracy/dsh-subprocess-docker` answers those `rejected` on the host
# (`registerApprovalAnswer`), so an old conversation cannot hang either.
#
# The cowork bundle does NOT carry these rows: its profiles run dsh's own sandbox on the owner's
# machine, where a wider mode is a real grant and the owner's browser shows the question.
- id: approval
  config:
    policy: never
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: never
      workspace-write:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# dsh 0.1.6-alpha.2 adds three more `web-app` rows, and none of them is for a Tracy customer:
# `ui-sidebar-browser` is a fourth tab type of that same right Sidebar (an iframe with no
# frame-proxy for sites that refuse embedding — WordPress and Joomla refuse by default —, no
# reload API another plugin could call, and no credentials seam; better-sidebar's Browser tab has
# all three, see tasks/nhat-ky-main.md 19/09); `ui-plugin-manager` is the sidebar Plugins page
# over a manager that rewrites the profile of the whole host (the manager itself stands down in
# the fleet profile patch); `workspace-changes` is the changed-files card under each turn, and it
# lists nothing a customer would recognise: a site folder is not a git repository, so the card
# only sees the three first-party file tools and misses every wp-cli/php edit the agent makes —
# a card saying "nothing changed" under a turn that rebuilt the page is worse than no card. It
# may come back for the developer preset as its own piece of work.
# Since 0.1.7-rc.2 `web-app` disables `ui-sidebar-browser` by itself outside a profile NAMED
# `desktop` (a YAML code-tag expression on `profileContext.name`); the row stays, because a
# decision about customers should not hang on what a profile directory happens to be called.
- id: ui-sidebar-browser
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: workspace-changes
  disabled: true
# `ui-deliverables` is the changed-files card that row feeds; since dsh 0.1.7 it injects
# `workspaceChanges` as a hard dependency, so with the row above off it sat `pending` on every
# boot ("1 entry did not activate", measured 26/09 on the local stand — and already on the 0.1.6
# image, where it was the same warning nobody read). Off explicitly, for the same reason as its
# feed; Tracy's own turn-tail cards (site-build-core, design-inspiration) carry the outcome.
- id: ui-deliverables
  disabled: true

# The manager those Plugins pages sit on, and the watcher that applies its edits live, stand down
# here too — not only in the fleet's own profile patch. `base` mounts both behind a YAML
# code-tag expression, `!ctx.get("profileContext")`, i.e. ON wherever a profile exists — every
# local `native` boot; measured 19/09 on the composed tree. A local stand that carries a runtime
# profile editor the fleet does not is a stand that measures a different system (ADR 0014:
# a profile changes through an image build, on every host alike).
- id: plugin-manager
  disabled: true
- id: hmr
  disabled: true

# ── dsh 0.1.7-rc.2's new rows stand down ───────────────────────────────────────
# The upgrade turned these on by default in `base`/`web-app`, and none of them is for a Tracy
# customer (plan `tasks/todo-dsh-0.1.7-rc.2.md`, decisions 4 and 6). One line each:
#
# `settings`, `config-editor` — since 0.1.7 a live Config form edit is WRITTEN INTO THE PROFILE'S
#   `cordis.patch.yml` (`config-editor`), and `agent-default-model` saves a model pick the same way
#   (`saveSelection`, a no-op without an editor). One dsh serves every site on a host (ADR 0014), so
#   a browser writing the profile rewrites every customer's configuration; the image build stays
#   the only path. Upstream mounts both only where a profile context exists — every profile here.
# `authorization` — the human sign-in flow registry. Its one required consumer is
#   `deepseek-account` below (`deepseek-account-platform/src/index.ts:85`); `llm-pi-ai` asks for it
#   optionally, and neither `dsh-passwords` (injects `webServer`, `connection`) nor a Tracy plugin
#   reads it.
# `deepseek-account`, `llm-deepseek-account`, `account-controller`, `ui-settings-account` — DeepSeek
#   account sign-in and the model route over it. Tracy picks the model and holds the key at the
#   host (`llm-deepseek` + `DEEPSEEK_API_KEY`); an account signed in here would be the whole host's.
# `ui-settings-shell`, `ui-settings-agent-loop`, `ui-settings-subagent`, `ui-settings-web-search` —
#   Plugins-page forms over host-plane namespaces (shell timeout, tool-call cap, subagent models,
#   the web-search key): every site's, for the same reason as `settings`.
# `cordis-inspect-providers` — the Host half of `tool-cordis`, which only dsh's `cordis` preset
#   mounts (disabled in the preset block below); no Tracy preset does.
# `ui-shortcuts` is NOT here any more (28/09/2026): it registers the Keyboard shortcuts row of
#   Settings › General and the shortcut reference overlay, and on the web it persists a rebinding
#   only to the viewer's own localStorage (`dsh.keybindings.v1`) — no host state. Whether the row
#   shows is the operator switch `shortcuts` (@tracy/core ui-switches), not this file.
# `product-analytics`, `ui-settings-session-log`, `otel`, `session-telemetry-otel` — new upstream client and telemetry rows.
#   Customer profiles keep these disabled until a separate product and data review.
# `open-in-app`, `ui-open-in-app` — the session header's "Open in app" button (29/09/2026). It
#   launches an editor on the machine dsh runs on, never on the customer's: on a host every command
#   goes through `tracy-subprocess-docker`, whose `resolveExecutable` answers every name (the lookup
#   happens at `docker exec`), so the button listed 19 editors, 404ed each icon, and a click
#   answered 502 "failed to launch cursor" (measured 29/09 on the stand). The operator switch that
#   hid it (`dsh-open-in-app`) left with it.
#
# KEPT, on purpose: `shortcuts` is the command registry `ui-layout` and `ui-sidebar` REQUIRE
# (`ui-layout/src/client/index.ts:143`) — off, the whole client stops at "waiting for service:
# shortcuts". `job-controller` streams background-job records read-only, and `dsh-better-sidebar`
# 0.21.1 lists jobs through it.
- id: settings
  disabled: true
