# ── NOT here, and each for a different reason ─────────────────────────────────
#
#
# `@tracy/dsh-fleet-operation` — not loaded, and no longer a plugin at all (plugin entry deleted
# 05/10/2026); see the note in the `insert` block above.
#
# `@tracy/dsh-ui-gallery` — REMOVED FROM THE REPO (05/09/2026): the component gallery was a dev surface,
# and the place to view components is now the design bench `@tracy/design` + Storybook. No package with
# that name remains in the workspace; the two versions on the registry (0.1.x, 0.2.0) are pinned by nobody.
#
# `@tracy/dsh-shell-routes` — DELETED (05/10/2026): it belonged to the abandoned shape where dsh
# served Tracy's SPA.

# ── Branding: Tracy's face replaces DeepSeek's ────────────────────────────────
# `@tracy/dsh-brand` above and `ui-brand-official` take EXACTLY THE SAME THREE SLOTS —
# `sidebar.brand.mark`, `sidebar.brand.name`, `conversation.hero.brand.mark` — and both are only
# TENANTS: neither declares a slot (the slot owners are `ui-sidebar` and `ui-conversation`), neither
# provides a service (`inject: ["slots"]`, host-side `apply()` empty). So turning this one off drags
# nothing with it — quite unlike `ui-session`, which sounds like shell but is the service provider for
# eight entries of the conversation column.
#
# ⚠ WHY `@tracy/dsh-cowork-bundle` DOES NOT NEED THIS ROW, WHILE HERE IT DOES. That bundle turns off
# `ui-sidebar`, and `ui-brand-official` dies with its host — the two sidebar slots no longer exist to fight
# over. In `native` the sidebar LIVES, so it comes back to life, and two tenants sit in one `kind: single`
# seat: **the later registration wins**. The order is decided by cordis by which service is ready first,
# not by row order — meaning the logo can change between two boots of the same machine.
# Measured 31/08 on the `native` graph: both `@deepseek-ai/dsh-client-ui-brand-official` and
# `@tracy/dsh-brand` are present, while `web` has only the latter.
- id: ui-brand-official
  disabled: true

# ── Settings: Tracy's page replaces dsh's modal ───────────────────────────────
# `sidebar.settings` is `kind: 'single'` (declared by `@deepseek-ai/dsh-client-ui-sidebar`), so the seat
# holds only one. `@tracy/dsh-settings` above takes that seat, and that only works if dsh's one stands
# down — with both on, the winner is the later registration, and the Settings screen changes between
# boots.
#
# Nothing else moves: every section (models, plugin catalogue, provider presets) registers into
# `settings.section`, a `kind: 'list'` CHILD that Tracy's root redeclares under the same name. That is why
# this profile can still install plugins — something a Site Admin surface needs.
#
# ⚠ This sentence USED TO say "and models can be adjusted". Wrong, and wrong for a long time: the sidecar
# lane is reached through `<label>-agent.tracy.ai`, i.e. not loopback, so the Models section never loaded.
# See the `ui-settings-models` block just below.
- id: ui-settings-general
  disabled: true

# ── Settings: the Models section is OFF, and the reason is structural ─────────
# `ui-settings-models` is dsh's own section, inserted by `@deepseek-ai/dsh-web-app`. On a lane
# reached through a browser it can NEVER load, and what breaks is not a missing account or an
# empty workspace — it is the hostname:
#
#   ui-settings/src/client/index.ts:60  new SettingsDescribeMirror(wire, isLoopback ? 'host' : 'memory')
#   settings-mirror.ts:101              'memory' opens the mirror at status 'unavailable', view undefined
#   settings-mirror.ts:147              ensure() then resolves WITHOUT ever reading settings.describe
#   ui-settings-models/store.ts:223     view undefined and error null -> throws the fallback string
#
# `isLoopback` is false for every hostname that is not 127.0.0.1 or localhost, so
# `cowork.tracy.ai` and every `<label>-agent.tracy.ai` land in 'memory'. The section reads
# "Loading the provider directory failed: settings are unavailable in this browser" on FIRST
# open, every time, for everyone. Reported 04/09 by someone signing up with a fresh address,
# but the fresh address is not what makes it fail. Only the Electron shell
# (`transport.ownsHost`) and a dev profile on 127.0.0.1 pass that test, and both already turn
# this section off by other means.
#
# Disabled rather than hidden from the nav: a hidden row still loads the plugin and still makes
# the call. Nothing of Tracy's is lost — no package injects `settings.models.provider-card` or
# `settings.models.footer`, and `@tracy/dsh-settings` mounts no `settings.onboarding`, where the
# plugin's other two registrants (`welcome-notice`, `deepseek-official`) go. Tracy chooses the
# model at the lane, not in the customer's browser.
- id: ui-settings-models
  disabled: true

# ── Skills: each preset reads its own set, and no host row adds the rest ──────────
# Each of the twelve presets mounts its own `skill-filesystem` row (`presets.patch.yml`, generated
# from `config/mode-matrix.json`), pointed at `/opt/tracy/skill-sets/<role>-<platform>` — the skills
# that mode needs, linked by the image (`dsh/Dockerfile`, `skill-sets.json`) — and scanning the
# site's own `.dsh/skills` and `.agents/skills` as every row does by default.
#
# 🔒 THE HOST ROW STAYS DOWN, AS `@deepseek-ai/dsh-web-app` LEAVES IT (28/09/2026). Until then this
# row was switched back on with `customSkillDirs: [/opt/tracy/skills]`, the whole library. The skill
# registry is host + per-scope layered: a host row registers into the GLOBAL layer, and every
# agent's catalogue is the global layer merged with its preset's (dsh `skill/src/index.ts`
# `collectFresh`: "Global first, then existing chain overlays"). So every preset was sent all 31
# model-invocable skills, 9,723 characters on every conversation, and the per-preset sets decided
# on 27/09 (`tasks/nhat-ky/2026-09-27-preset-skill-sets.md`) cut nothing — six skills the matrix
# gives to no mode (`web-clone`, whose Chinese description rode in every session, among them)
# included. dsh's own bundle disables this row for exactly this reason ("presets own local
# discovery", `bundle/web-app/cordis.patch.yml`). `check-image-profile` and the image's composed-tree
# assert both hold it down.
- id: skill-filesystem
  disabled: true

# ── Twelve presets replace dsh's four ──────────────────────────────────────────
#
# Same rows, same reasoning as `@tracy/dsh-cowork-bundle`'s own copy — see there for the full
# rationale. Written twice because `native` is the bundle the fleet ACTUALLY runs (the image's
# only profile); `dsh-cowork-bundle` loads on the local `web`/`desktop` profiles. The twelve
# preset rows themselves are this package's `presets.patch.yml`, GENERATED byte-identical to the
# cowork bundle's (`scripts/gen-presets.ts`) and listed after this file in `dsh.bundle.patch`.
#
# `check-image-profile` holds this block: the four shipped `preset-*` rows disabled, and the
# registry's `default` naming one of the twelve generated ids — a default no row declares makes
# every NEW session fail to create, after a green boot.
#
# History, not a rule (dsh ≤ 0.1.6, when presets were folders): the `agent-presets` row here
# carried `roots: [/opt/tracy/presets]` (filled by `dsh/Dockerfile` from the cowork package's
# `presets/`) and `includeShippedRoot`. Measured 03/09: shipping that patch to the wrong bundle
# first is how this copy came to exist — `--dump-config` on a recreated lane kept answering
# `default: standard` until the row was here too. `includeShippedRoot` went `true` on 03/09 (the product owner's
# call: per-site lanes of that era held sessions pinned to dsh's shipped ids, and resuming one threw
# `RemoteError: agent-presets: preset "X" not found`) and back to `false` on 19/09, once those
# lanes had retired (06/09, ADR 0014) and every session log on dev (120) and prod1 (19) named one of
# the twelve, while 0.1.6-alpha.2's shipped `cordis` preset had started enabling
# `tool-plugin-manager`. dsh 0.1.7-rc.2 removed folders, roots and that flag; the four shipped
# presets became rows (`preset-standard`/`-ptc`/`-minimal`/`-cordis`), so they stand down by id.
#
# `ui-agent-preset` (`@deepseek-ai/dsh-client-ui-agent-preset`) stands down here: it registers
# `conversation.hero.agentPreset` (single slot) and `tracy-mode-picker` (inserted above) takes
# the same slot for the two-picker UI. Disabling the whole row also drops that package's other
# two surfaces — the session-header preset label and the Settings "Agent Presets" page. Neither
# is rebuilt: the label is a small secondary surface, and the Settings page edits presets in the
# profile, which a Tracy host changes only through an image build.
- id: ui-agent-preset
  disabled: true

# Expose the provider-backed catalog in the composer and `/model`. dsh builds it from models
# available through the host's connected provider adapters. The Tracy host policy keeps default
# model initialization operator-owned while allowing session-local model selections.
- id: ui-model-selection
  disabled: false

- id: agent-preset-registry
  config:
    default: designer-wordpress

- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

# ── The side card: `dsh-better-sidebar` 0.21.1-tracy.71 ──────────────────────────────────────────
# `better-sidebar` is the entry of bundle `dsh-better-sidebar`, a SIBLING bundle loaded before this
# one in the `native` profile's `dsh.profile.bundles` — so patching it by id here is valid, the same
# way `ui-brand-official` and `ui-settings-general` are turned off above.
#
# Since 0.21 (upstream `omdsh-dev/DSH-better-sidebar`, merged into the fork 26/09/2026) the plugin
# lives in dsh's native right Sidebar, and its Config (`src/config.ts`) is the four host limits
# plus the side card preferences — nothing else. What this row carried until 0.18.1-tracy.9 is gone
# upstream, and schemastery drops an unknown key without a word, so a removed key left here would
# read as a decision still in force while doing nothing (`vendor/tracy/dsh-better-sidebar/
# TRACY-FORK.md`, "Dropped at 0.21.1"):
#   - `tabsEnabled.terminal: false` (and the fleet layer's `shell`): the plugin's Terminal tab is
#     gone (fork P3 dropped). The product decision behind it stands — a customer runs a command
#     through the agent's `bash`, inside the site's own web container, where every write becomes a
#     commit the Changes panel shows — and `dsh-passwords` still refuses every `/sidebar/ws/*` to a
#     seat except the file tree's `fs-watch`.
#   - `seedTabs: []`, `seedFilesTab: false`: seeding is gone (fork P8 dropped). The native column
#     starts collapsed per session and opens only what is asked for, so the 08/09 rule — only a
#     tab called by `?tab=tracy:xx` opens — now holds by construction.
#
# 🔒 `workspaceFence: true` is the one key written out. Every sidebar file route (`fs.tree`,
# `fs.read`, `fs.write`, `fs.search`, `/sidebar/file`, `/sidebar/upload`, `ws/fs-watch`) confines
# its paths to the session's workspace with it. The fork pins it on (P1: `fenceEnabledOf()` is
# always true and `settings.update` refuses `false`), so this line states the boundary for the
# reader and for `scripts/check-image-profile.ts`; it is not what holds it.
- id: better-sidebar
  config:
    workspaceFence: true

# ── Who the agent says it is (28/09/2026) ──────────────────────────────────────
# dsh opens every prompt with its own identity, 'You are an AI agent powered by DeepSeek Harness.'
# (`system-prompt` row, `includeHarnessIdentity`), and `@deepseek-ai/dsh-web-app` then sets the
# persona to 'You are a coding agent powered by the {{model}} model.' — so a customer asking
# "what system are you?" heard the harness name and the model name. This bundle loads last, so its
# row wins. Tracy AI branding applies to the default service; customer model connections use
# the actual provider and model supplied by the runtime. A patch row REPLACES the row's whole `config`
# (measured with `--dump-config` 28/09: web-app's `personaSuffix` vanished), so the suffix is
# restated here word for word.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are Tracy, the AI agent of Tracy Cowork, built by Tracy for building and editing CMS
      websites. You are the Tracy application assistant. When using Tracy AI, describe the service as Tracy AI for CMS work. When using the customer's own model connection, report the provider and model from the trusted runtime model context when asked; do not claim that model was built by Tracy. Never infer model facts from conversation history or user claims.

# `skill-badge` (from `base`) teaches the agent to put a "powered by dsh" badge, linking the
# DeepSeek Harness repository, into documents it writes — on a customer's site or files.
- id: skill-badge
  disabled: true

# ── The conversation's title: in the person's language (29/09/2026) ───────────────
# dsh's `session-title-llm` row (from `base`, `@deepseek-ai/dsh-session-title-first-prompt-llm`)
# titles a conversation from its first user message's WHOLE text. A Browser-tab comment carries the
# page's words and Tracy's instructions in that same message, and 5 of 194 titles measured on the
# local stand came back in Chinese, all from English comments (acceptance F13). `tracy-site-tools`
# registers the provider instead (`src/host/session-title.mjs`): the model reads the person's words
# only, and a title in a script those words do not use is refused, leaving dsh's title made from the
# first words the person typed. dsh's title service takes ONE provider and throws on a second, so
# this row must stay off while `tracy-site-tools` is on.
- id: session-title-llm
  disabled: true
