  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'compression@<1.8.2': 1.8.2
  'dompurify@>=3.0.0 <3.4.17': 3.4.17
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'fflate@>=0.8.0 <0.8.3': 0.8.3
  # 4.2.1 was never published; 4.3.0 is the first fixed release of the 4.x line.
  'http-cache-semantics@<4.2.1': 4.3.0
  'hono@>=4.0.0 <4.13.11': 4.13.11
  'ip-address@>=10.0.0 <10.7.4': 10.7.4
  'pnpm@>=11.0.0 <11.11.0': 11.11.0
  'postcss-selector-parser@<6.1.5': 6.1.5
  'proxy-addr@<2.0.8': 2.0.8
  'qs@>=6.0.0 <6.16.0': 6.16.0
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'vite@>=6.0.0 <6.4.4': 6.4.4
  'vite@>=8.3.0 <8.3.3': 8.3.3
