<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JA Voyara colors</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
      main { max-width: var(--container-max); margin: 0 auto; padding: var(--space-12) var(--space-6); }
      h1 { margin: 0 0 var(--space-6); font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-display); color: var(--fg-2); }

      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-4); }
      .swatch { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; box-shadow: var(--elev-card); }
      .color { height: 88px; background: var(--value); }
      .meta { padding: var(--space-3); color: var(--muted); font-size: var(--text-sm); font-family: var(--font-mono); }
      strong { display: block; margin-bottom: var(--space-1); color: var(--fg); font-family: var(--font-body); }
    </style>
  </head>
  <body>
    <main>
      <h1>Color roles</h1>

      <section class="grid">
        <article class="swatch" style="--value: var(--bg)"><div class="color"></div><div class="meta"><strong>Cream canvas</strong>--bg</div></article>
        <article class="swatch" style="--value: var(--surface)"><div class="color"></div><div class="meta"><strong>Paper white</strong>--surface</div></article>
        <article class="swatch" style="--value: var(--surface-warm)"><div class="color"></div><div class="meta"><strong>Warm sand</strong>--surface-warm</div></article>
        <article class="swatch" style="--value: var(--fg)"><div class="color"></div><div class="meta"><strong>Body ink</strong>--fg</div></article>
        <article class="swatch" style="--value: var(--fg-2)"><div class="color"></div><div class="meta"><strong>Heading ink</strong>--fg-2</div></article>
        <article class="swatch" style="--value: var(--muted)"><div class="color"></div><div class="meta"><strong>Warm grey</strong>--muted</div></article>
        <article class="swatch" style="--value: var(--border)"><div class="color"></div><div class="meta"><strong>Warm hairline</strong>--border</div></article>
        <article class="swatch" style="--value: var(--accent)"><div class="color"></div><div class="meta"><strong>Terracotta</strong>--accent</div></article>
        <article class="swatch" style="--value: var(--accent-hover)"><div class="color"></div><div class="meta"><strong>Terracotta deep</strong>--accent-hover</div></article>
        <article class="swatch" style="--value: var(--success)"><div class="color"></div><div class="meta"><strong>Deep teal</strong>--success</div></article>
        <article class="swatch" style="--value: var(--warn)"><div class="color"></div><div class="meta"><strong>Warm amber</strong>--warn</div></article>
        <article class="swatch" style="--value: var(--danger)"><div class="color"></div><div class="meta"><strong>Brick</strong>--danger</div></article>
      </section>
    </main>
  </body>
</html>
