<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us – Acme</title>
</head>
<body>
  <nav style="background:#2b6cb0; padding:1rem;">
    <a href="/" style="color:#fff; font-weight:bold;">Acme</a>
  </nav>

  <main style="max-width:600px; margin:3rem auto; padding:0 1rem;">
    <h1 style="margin-bottom:1.5rem;">Get in Touch</h1>

    <form action="/contact" method="post" style="display:grid; gap:1rem;">
      <div>
        <label for="name" style="display:block; margin-bottom:.25rem;">Name</label>
        <input id="name" name="name" type="text" placeholder="Jane Smith"
               style="width:100%; padding:.5rem; border:1px solid #cbd5e0; border-radius:4px;">
      </div>

      <div>
        <label for="email" style="display:block; margin-bottom:.25rem;">Email</label>
        <input id="email" name="email" type="email" placeholder="jane@example.com"
               style="width:100%; padding:.5rem; border:1px solid #cbd5e0; border-radius:4px;">
      </div>

      <div>
        <label for="message" style="display:block; margin-bottom:.25rem;">Message</label>
        <textarea id="message" name="message" rows="5"
                  style="width:100%; padding:.5rem; border:1px solid #cbd5e0; border-radius:4px;"></textarea>
      </div>

      <button type="submit"
              style="background:#2b6cb0; color:#fff; padding:.75rem 1.5rem; border:none; border-radius:4px; cursor:pointer;">
        Send Message
      </button>
    </form>
  </main>

  <footer style="background:#1a202c; color:#a0aec0; text-align:center; padding:2rem;">
    <p>&copy; 2026 Acme Inc. All rights reserved.</p>
  </footer>
</body>
</html>
