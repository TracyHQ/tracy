<!DOCTYPE html>
<html lang="en-gb" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>404 — Tracy Base</title>
    <script>(function(){try{var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;var t=d?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);if(d){document.documentElement.classList.add('t4-dark');}}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.setAttribute('data-bs-theme','light');}})();</script>
    <link rel="stylesheet" href="/templates/tracy/css/template.css">
        <style>
        /* The page is one centred column on the plain canvas — no card, no shadow. Section
           separation and containment rules do not apply to a page with a single element. */
        .tracy-standalone {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: var(--space-12) var(--container-gutter-desktop);
            text-align: center;
            background: var(--bg);
            color: var(--fg);
        }
        .tracy-standalone__code {
            font-family: var(--font-display);
            font-size: var(--text-4xl);
            line-height: var(--leading-tight);
            letter-spacing: var(--tracking-display);
            margin: 0 0 var(--space-4);
        }
        .tracy-standalone__msg {
            color: var(--muted);
            font-size: var(--text-lg);
            max-width: 52ch;
            margin: 0 auto var(--space-8);
        }
    </style>
</head>
<body class="tracy-error">
    <main class="tracy-standalone">
        <div>
            <p class="tracy-standalone__code">404</p>
            <p class="tracy-standalone__msg">Page not found</p>
            <p><a class="btn btn-primary tracy-btn--primary" href="/">Back to Tracy Base</a></p>
        </div>
    </main>
</body>
</html>
