# Starts Turborepo's remote cache for this job (12/10/2026): `scripts/ci/turbo-cache-server.mjs`
# (no dependency, ~0.2 s to start) on 127.0.0.1:43901, backed by the GitHub Actions cache of this
# repository since 30/10/2026 (a Cloudflare R2 bucket before, through four secrets that were never
# set on the public repository). No secret: a random bearer token per job, and the runner's own
# ACTIONS_RUNTIME_TOKEN. Needs the repository checked out. Exports TURBO_API, TURBO_TOKEN,
# TURBO_TEAM and TRACY_DSH_COMMIT.
#
# A `node` action, not a composite one, because the runner hands ACTIONS_RUNTIME_TOKEN and
# ACTIONS_RESULTS_URL to JavaScript actions only (`start.mjs` has the details).
#
# 🔒 IT NEVER FAILS THE JOB. A cache that does not start leaves Turbo on its local cache: a test row
# then runs every task it was given, and the plan job sees every task as missing — both fail closed.
#
# WHO READS WHAT (GitHub's cache scopes): a run reads entries of its own ref, of its base branch and
# of `main`, and writes only under its own ref. The nightly (`schedule`, ref `main`) forces every
# Turbo task and so writes what every pull request can read; a pull request writes for its own
# later pushes only. A fork's pull request is read-only (`start.mjs`).
name: Turbo remote cache
description: Start the Turbo remote cache (GitHub Actions cache) for this job
inputs:
  port:
    description: Local port of the cache server
    required: false
    default: '43901'
runs:
  using: node24
  main: start.mjs
