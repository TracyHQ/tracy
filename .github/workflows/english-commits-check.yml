# The English-only gate for git history: the commits a pull request adds, its title and its
# description. Logic lives in `scripts/check-english-commits.mjs` (runs at a desk against a saved
# payload: `node scripts/check-english-commits.mjs <payload.json>`); this file only runs it.
#
# It reads `base..head`, never older history, so it needs real history (`fetch-depth: 0`) but
# stays quiet about older commits already on `develop`. No install step: a few seconds on a
# GitHub-hosted runner, like `pr-description-check.yml`.

name: English Commits Check

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, develop]
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: english-commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-english:
    name: english
    # GitHub-hosted since 27/10/2026 (the repository is public: hosted minutes are free, and no other
    # repository's quota can stop this gate). One job for a branch of this repository and for a fork:
    # it reads the payload and git with a read-only token and no secret (public-repo-ci.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check commits, title and description are English
        run: node scripts/check-english-commits.mjs
