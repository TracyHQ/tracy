# The English-only gate for git history: the commits a pull request adds, its title and its
# description. Logic lives in `scripts/check-english-commits.mjs` (runs at a desk against a saved
# payload: `node scripts/check-english-commits.mjs <payload.json>`); this file only runs it.
#
# It reads `base..head`, never older history, so it needs real history (`fetch-depth: 0`) but
# stays quiet about older commits already on `develop`. Same runner choice as
# `pr-description-check.yml`: no install step, a few seconds on `ubuntu-latest`.

name: English Commits Check

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, develop]
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: english-commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-english:
    name: english
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Branches of this repository; a fork gets `english (fork)` below.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check commits, title and description are English
        run: node scripts/check-english-commits.mjs

  # A fork's pull request: the same script on a GitHub-hosted runner, no secret, read-only token.
  check-english-fork:
    name: english (fork)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check commits, title and description are English
        run: node scripts/check-english-commits.mjs
