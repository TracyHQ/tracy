# Branch freshness — a ready pull request may not trail its base by more than one working day.
#
# `develop` takes roughly 40–70 first-parent commits a day (measured 20/09–03/10/2026). A branch cut
# earlier than that collides at merge time, or rebuilds what another session already shipped. The
# pre-push hook only warns (a push is how unfinished work is saved); this job goes red once the
# pull request is ready for review, when the code is about to reach a shared branch and a deploy.
#
# CI cannot block a merge here (free plan, private repo: no branch protection), so a red job is the
# signal and `pr-merge` §3 is the rule: merge the base in before marking a pull request ready.
#
# The logic lives in `scripts/check-branch-fresh.mjs`, runnable at a desk on a saved payload:
#
#     node scripts/check-branch-fresh.mjs --ci <payload.json>

name: Branch Fresh Check

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, develop]
    # `edited` (26/10/2026): retargeting a pull request fires it, and a fresh run is the only record of
    # which base this verdict was made against.
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: branch-fresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-fresh:
    name: branch-fresh
    # GitHub-hosted since 27/10/2026 (the repository is public: hosted minutes are free, and no other
    # repository's quota can stop this gate). One job for a branch of this repository and for a fork:
    # it reads the payload and git with a read-only token and no secret (public-repo-ci.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      # 🔒 `fetch-depth: 0`: the gate walks the base's history back to the fork point; one commit is not enough.
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check branch freshness
        run: node scripts/check-branch-fresh.mjs --ci
