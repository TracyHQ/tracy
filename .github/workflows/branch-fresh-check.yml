# Branch freshness — a ready pull request may not trail its base by more than one working day.
#
# `develop` takes roughly 40–70 first-parent commits a day (measured 20/09–03/10/2026). A branch cut
# earlier than that collides at merge time, or rebuilds what another session already shipped. The
# pre-push hook only warns (a push is how unfinished work is saved); this job goes red once the
# pull request is ready for review, when the code is about to reach a shared branch and a deploy.
#
# CI cannot block a merge here (free plan, private repo: no branch protection), so a red job is the
# signal and `pr-merge` §3 is the rule: merge the base in before marking a pull request ready.
#
# The logic lives in `scripts/check-branch-fresh.mjs`, runnable at a desk on a saved payload:
#
#     node scripts/check-branch-fresh.mjs --ci <payload.json>

name: Branch Fresh Check

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, develop]
    # `edited` (26/10/2026): retargeting a pull request fires it, and every pull-request job now runs on
    # the dev lane, so a fresh run is the only record of which base this verdict was made against.
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: branch-fresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-fresh:
    name: branch-fresh
    # Pull-request code never runs on the production lane, whatever the base (public-repo-ci.md).
    runs-on: [self-hosted, linux, tracy-light, tracy-lane-dev]
    timeout-minutes: 10
    # Team runners take only branches of this repository; a fork gets `branch-fresh (fork)` below.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # 🔒 `fetch-depth: 0`: the gate walks the base's history back to the fork point; one commit is not enough.
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check branch freshness
        run: node scripts/check-branch-fresh.mjs --ci

  # A fork's pull request: the same script on a GitHub-hosted runner, no secret, read-only token.
  branch-fresh-fork:
    name: branch-fresh (fork)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check branch freshness
        run: node scripts/check-branch-fresh.mjs --ci
