name: English Contribution Policy

on:
  pull_request:
    branches: [main, staging, develop]
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: language-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  language-policy:
    name: language-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The validator and policy are immutable BASE bytes, never imports from the PR checkout.
      - name: Check out the trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          submodules: false

      # Only Git data is read here. Do not run npm, hooks, builds or actions from this directory.
      - name: Fetch the contribution and its complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          submodules: false

      # A release PR (develop -> main) carries develop's history, which already passed this check with
      # develop's policy when it was merged there. Fetch develop as Git data only, so the check below
      # skips it and reads only what is not on develop: merges of main and work on the release branch.
      - name: Fetch develop's history for a release
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release/develop-to-main-')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          path: develop-history
          persist-credentials: false
          submodules: false

      - name: Set up the trusted Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.node-version

      - name: Require English in every new commit and the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          exclude=()
          if [ -d develop-history ]; then
            # --exclude reaches main with the release that adds it; until then main's validator
            # checks the whole range, as before.
            if grep -q "exclude: { type: 'string' }" trusted/scripts/check-language-policy.mjs; then
              develop="$(git -C develop-history rev-parse HEAD)"
              git -C candidate fetch --quiet --no-tags "$GITHUB_WORKSPACE/develop-history" "$develop"
              exclude=(--exclude "$develop")
            else
              echo "::notice::main's validator has no --exclude yet; checking every commit not on main."
            fi
          fi
          node trusted/scripts/check-language-policy.mjs \
            --repo candidate --base "$BASE" --head "$HEAD" --event "$GITHUB_EVENT_PATH" "${exclude[@]}"
