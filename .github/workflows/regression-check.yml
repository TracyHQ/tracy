# The Regression gate — a fix or a feature leaves a regression case behind, run on its own branch.
#
# WHICH PULL REQUESTS. `fix(...)`/`fix/…` and `feat(...)`/`feat/…` (title or branch; fix wins when
# they disagree). Every other kind is skipped in under a second. Green needs ONE of:
#   (a) the diff adds or edits a case of the same kind in `tests/regression/cases/`, and a `PASS`
#       line for it in `tests/regression/results/` whose commit belongs to this branch;
#   (b) feat only: a body line `Regression: none — <reason, at least 10 characters>`.
# How to write and run a case: `tests/regression/README.md`.
#
# IT DOES NOT RUN THE CASES. That needs a stand and a model (`tests/regression/run.mjs`); this gate
# reads the event payload and git, nothing else, so it runs on `ubuntu-latest` with `description`
# and `changelog` (free for a public repository; see `pr-description-check.yml`).
#
# 🔒 `fetch-depth: 0`, NOT THE DEFAULT. The gate asks git whether a result's commit is reachable
# from the head and not from the merge base; a one-commit checkout cannot answer that, and the gate
# would go red for infrastructure instead of content.
#
# THE LOGIC LIVES IN `scripts/check-regression.mjs`, not inline in YAML, so it runs at a desk on a
# saved payload: `node scripts/check-regression.mjs <payload.json>` (lesson of
# `pr-description-check.yml`).

name: Regression Check

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, develop]
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-regression:
    name: Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Branches of this repository; a fork gets `Regression (fork)` below.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Runs on drafts too (06/10/2026), for the same reason as `description`: it reads the payload and
    # git only, so it is cheap, and a draft that is missing its case should hear it before the flip.
    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # `$GITHUB_EVENT_PATH` is the event payload the runner already wrote to disk — no token, no
      # API call, so nothing in this step can fail except the logic under test.
      - name: Check regression case
        run: node scripts/check-regression.mjs

  # A fork's pull request: the same script on a GitHub-hosted runner, no secret, read-only token.
  check-regression-fork:
    name: Regression (fork)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check regression case
        run: node scripts/check-regression.mjs
