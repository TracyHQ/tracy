# After a pull request is merged into develop or main: did Tracy CI pass on the commit that was
# merged? Branch protection on `develop`/`main` requires only `language-policy`, not Tracy CI,
# so a red Tracy CI does not refuse the merge. This makes one impossible to miss instead: a
# comment on the pull request and a red job. Logic and reasons: scripts/check-merged-ci.mjs.
name: CI Before Merge

permissions:
  contents: read
  actions: read
  pull-requests: write

on:
  pull_request:
    branches: [main, staging, develop]
    types: [closed]

jobs:
  # A branch of this repository: a fresh GitHub-hosted runner (free for a public repository), the CI
  # read App token. The checkout is the base branch as it is now (the merge is already on it), not the
  # pull request's merge ref, and no credential stays in it (public-repo-ci.md).
  merged-ci:
    name: merged with green Tracy CI
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Create repository-scoped CI read token
        id: ci-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACY_CI_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACY_CI_MERGE_APP_PRIVATE_KEY }}
          owner: TracyHQ
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read

      - name: Did Tracy CI pass on the merged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TRACY_CI_READ_APP_TOKEN: ${{ steps.ci-app.outputs.token }}
        run: node scripts/check-merged-ci.mjs

  # A fork's pull request never ran Tracy CI on the team's runners (only `fork pull request checks`),
  # so there is no verdict to read and its token cannot comment: say so in the run, nothing else.
  merged-ci-fork:
    name: merged with green Tracy CI (fork)
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report a fork merge
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "::warning::Merged from a fork: Tracy CI never ran its full rows on this code. Run Tracy CI on $BASE (Actions → Tracy CI → Run workflow) and fix forward if it is red."
