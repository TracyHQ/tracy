# The changelog gate — a change that touches other people has to say who it touches.
#
# WHY IT EXISTS. This repository runs several agent sessions in parallel, and the price of silence
# has been measured: `tasks/lessons.md` §6 tells of a fix swallowed into another session's commit
# that then **nobody deployed** — the bug lived one more day after it was fixed.
#
# WHICH BRANCHES — changed 2026-09-14. `[main]` alone guarded the frozen seven-Worker line and
# nothing that is alive; `develop` (where everyone works) and `main-v3` (production for the
# tracy-web architecture) had no changelog gate at all. See the same block in `tracy-ci.yml`.
#
# WHERE IT RUNS — `ubuntu-latest` again since 27/10/2026. From 08/09 it ran on the team's runners:
# the org's shared quota of hosted minutes ran out on 06/09 and this gate died in three seconds 204
# times in a row, reds indistinguishable from a missing entry. A public repository's hosted minutes
# are free and unmetered, so that reason is gone.
#
# 🔒 `fetch-depth: 0`, NOT THE DEFAULT. `actions/checkout` takes exactly one commit by default; this
# gate needs both `payload.before` and `payload.after` present in the tree before `git diff` has a
# base to compare against. Without it the gate dies with "bad object" — red for infrastructure,
# not for content, the most expensive way a gate can fail.
#
# 🔒 GUARDS BOTH `push` AND `pull_request`. Most pushes to a shared branch in this repository are
# direct pushes, not PRs. A gate that only watches `pull_request` watches the minority.
#
# THE LOGIC LIVES IN `scripts/check-changelog.mjs`, not inline in YAML — a lesson paid for once in
# `pr-description-check.yml`: a CI gate that cannot be run outside CI is a gate that can only be
# debugged by pushing.

name: Changelog Check

permissions:
  contents: read

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changelog:
    name: changelog
    # GitHub-hosted since 27/10/2026 (the repository is public: hosted minutes are free, and no other
    # repository's quota can stop this gate). One job for a branch of this repository and for a fork:
    # it reads the payload and git with a read-only token and no secret (public-repo-ci.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The gate diffs two arbitrary commits of the push, so it needs history, not a snapshot.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # `$GITHUB_EVENT_PATH` is the event payload the runner already wrote to disk — no token, no
      # API call, so nothing in this step can fail except the logic under test.
      - name: Check changelog entry
        run: node scripts/check-changelog.mjs
