# deploy/nginx/shard.conf - the front door of a shard (spec section 3.1, amended 15/10/2026).
# On the machine and in the tracy-host image it is /opt/tracy-fleet/stack/nginx-shard.conf: that
# directory is flat (contract section 10, sync-fleet-files.sh).
#
# A TEMPLATE: compose.shard.yml mounts it as /etc/nginx/templates/default.conf.template and the
# nginx image's entrypoint renders it into /etc/nginx/conf.d/default.conf at every start. Only
# DEFINED environment variables are substituted, and TRACY_NETWORK_PREFIX is the only one this
# file uses; nginx's own variables ($host, $remote_addr, ...) are lowercase and pass through
# untouched.
#
# Path of a request: Cloudflare -> tunnel -> cloudflared (systemd, this VM) -> 127.0.0.1:80 ->
# Docker's loopback publish -> this container -> tracy-web:8080 -> bar/ decides by Host.

# The TCP peer is never the visitor: it is Docker's port publish, which reaches this container from
# the gateway of the `tracy` network (or 127.0.0.1). Port 80 is published on the VM's loopback only,
# so those two peers are cloudflared and nothing else; the visitor is CF-Connecting-IP.
set_real_ip_from 127.0.0.1;
set_real_ip_from ${TRACY_NETWORK_PREFIX}.1;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Per visitor address, after real_ip. Generous on purpose: one workspace page loads a few hundred
# assets through tracy-web; measure it on d1 (G1 step 1.10) before tightening.
limit_req_zone $binary_remote_addr zone=tracy_per_ip:10m rate=60r/s;
limit_req_status 429;

# A websocket upgrade keeps its Connection: upgrade; every other request sends none, so the
# upstream connection is plain HTTP/1.1.
map $http_upgrade $tracy_connection {
  default upgrade;
  ''      '';
}

# Cloudflare sends X-Forwarded-Proto: https, and bar/route.js builds the visitor's scheme from it
# (docs/references/may-dev.md #10). Only a request that arrived without one (a probe on the VM) is
# told this hop's own scheme.
map $http_x_forwarded_proto $tracy_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# Contract v1.1 section 4: the /handoff ticket travels in the URL (?t=), so the access log must
# never carry the query string of that path. Every other path keeps $request_uri. The map is
# evaluated when the line is written, so no variable here costs a request that is not logged.
map $uri $tracy_logged_uri {
  default             $request_uri;
  ~^/handoff(/|$)     $uri;
}

# `$request` (the combined format's request line) would carry the ticket, so the line is built
# from its parts. The Referer is left out for the same reason: it can echo a URL with a ticket.
log_format tracy_main '$remote_addr [$time_local] "$request_method $tracy_logged_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  access_log /var/log/nginx/access.log tracy_main;

  # Cloudflare Free / Pro stop at 100 MB anyway; imports and backups go to R2 by signed URL.
  client_max_body_size 100m;

  # Docker's embedded DNS: tracy-web is found again after deploy-tracy-stack.sh recreates it.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $tracy_web http://tracy-web:8080;

  location = /_nginx/health {
    access_log off;
    allow 127.0.0.1;
    deny all;
    return 200 "ok\n";
  }

  # The heartbeat reads this door over the VM's loopback (127.0.0.1:51710), never through here.
  location = /_shard/status { return 404; }

  # The /handoff response headers (Cache-Control: no-store, Referrer-Policy: no-referrer) are set
  # by tracy-web on every /handoff outcome (contract section 4); nginx passes them through as is.
  location / {
    limit_req zone=tracy_per_ip burst=600 nodelay;

    proxy_pass $tracy_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $tracy_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tracy_connection;

    # The headers that vouch for a seat on a site. bar/ strips them too (site-proxy.js); this is
    # the second fence. x-tracy-actor, x-tracy-session and the x-tracy-*-probe headers are NOT
    # touched: dsh plugins and the domain probes send them on purpose.
    proxy_set_header x-tracy-email "";
    proxy_set_header x-tracy-tier "";
    proxy_set_header x-tracy-role "";
    proxy_set_header x-tracy-edge "";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}

