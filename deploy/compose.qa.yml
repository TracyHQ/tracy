# QA stand overlay — the nightly independent QA stand `tracy-qa` on the Mac Studio's shared Docker.
#
# Always used as the THIRD file, after compose.yml and compose.macos.yml, and always through
# `scripts/qa/stand/qa-stand.mjs` (`composeArgs`), which passes:
#
#   docker compose --project-directory <qa-src>/deploy --env-file <QA_HOME>/.env -p tracy-qa \
#     -f compose.yml -f compose.macos.yml -f compose.qa.yml --profile local …
#
# The env file is generated by `scripts/qa/stand/make-env.mjs` and checked by `check-config.mjs`
# BEFORE any build. It also defines QA_HOME and QA_TOOL_DIR, which this file interpolates, so the
# stand never falls back to the shared checkout's `deploy/.env`.
#
# What differs from the shared stand, and why (tasks/todo-daily-qa.md §3.1, §3.3):
#   - its own project name, container names, ports (360xx) and subnets, so it can run beside every
#     other stand on the same daemon without taking a name, a port or a pool from any of them;
#   - the `tracy` network is `internal: true`: a site container joins it, and nothing leaves the
#     machine through it. tracy-web and tracy-host go out through `default`;
#   - tracy-dsh reaches the internet only through `qa-egress`, an allow-list CONNECT proxy that is
#     also the chat kill switch. The netfilter chain QA-EGRESS (scripts/qa/stand/netfilter.mjs)
#     rejects everything else leaving the dsh egress subnet and every QA site subnet;
#   - dnsmasq answers `*.qa.tracy.test` only and forwards nothing;
#   - the macOS-side `dns-host` resolver is not started (the shared stand owns port 5354).
name: tracy-qa

services:
  tracy-web:
    env_file: !override ["${QA_HOME:?QA_HOME must be set in the QA env file}/.env"]
    # The QA gate listens on 127.0.0.1:${WEB_PORT} (the address TRACY_ORIGIN names); the real
    # tracy-web is published one port above it and still LISTENS on ${WEB_PORT} inside, so every
    # address written into the database stays valid from inside the compose network too.
    ports: !override ["127.0.0.1:${QA_WEB_HOST_PORT:-36081}:${WEB_PORT}"]

  tracy-host:
    env_file: !override ["${QA_HOME:?QA_HOME must be set in the QA env file}/.env"]

  docker-proxy:
    container_name: tracy-qa-docker-proxy

  tracy-dsh:
    container_name: tracy-qa-dsh
    ports: !override ["127.0.0.1:${QA_DSH_PORT:-36700}:8080"]
    depends_on:
      qa-egress: { condition: service_healthy }
    environment:
      DSH_TRUSTED_HOSTS: "${HOST_NAME:-local}-agent.${SITE_DOMAIN},${SITE_DOMAIN}:${WEB_PORT},127.0.0.1:${QA_DSH_PORT:-36700},127.0.0.1:${WEB_PORT},host.docker.internal:${QA_DSH_PORT:-36700}"
      # Every outbound connection of the agent goes through the allow-list proxy below. Names the
      # stand itself answers stay direct (they are on the internal `tracy` network).
      HTTPS_PROXY: http://qa-egress:3128
      HTTP_PROXY: http://qa-egress:3128
      https_proxy: http://qa-egress:3128
      http_proxy: http://qa-egress:3128
      NO_PROXY: "localhost,127.0.0.1,tracy-web,tracy-host,docker-proxy,.${SITE_DOMAIN},${TRACY_NETWORK_PREFIX}.0/24"
      no_proxy: "localhost,127.0.0.1,tracy-web,tracy-host,docker-proxy,.${SITE_DOMAIN},${TRACY_NETWORK_PREFIX}.0/24"
      NODE_USE_ENV_PROXY: "1"

  dns:
    # Answers the stand's own names and nothing else: no upstream server, no resolv.conf.
    command: !override
      [
        '-k',
        '--log-facility=-',
        '--no-resolv',
        # No upstream: answer every other name (and AAAA) locally instead of REFUSED, which the
        # base healthcheck's nslookup treats as a failure.
        '--local=/#/',
        '--address=/${SITE_DOMAIN}/${TRACY_NETWORK_PREFIX}.10'
      ]
    # Without an upstream there is no AAAA answer, and plain nslookup fails on it; ask for A only.
    healthcheck:
      test: ["CMD", "nslookup", "-type=a", "healthcheck.${SITE_DOMAIN}", "127.0.0.1"]

  dns-host:
    profiles: !override [qa-never]

  # The allow-list proxy for tracy-dsh (same code as the model proxy, scripts/qa/fence/
  # egress-proxy.mjs, read from the pinned qa-tool tree, never from the product tree under test).
  # On `egress` to hear dsh, on `default` to reach the internet; `gw_priority` makes `default` its
  # route out, because the QA-EGRESS chain rejects anything leaving the egress subnet.
  qa-egress:
    image: node:24-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /qa/fence
    command: ["node", "/qa/fence/egress-proxy.mjs"]
    environment:
      QA_EGRESS_LISTEN: "0.0.0.0:3128"
      QA_EGRESS_ALLOW: "${QA_EGRESS_ALLOW:-api.deepseek.com,github.com,api.github.com,codeload.github.com,objects.githubusercontent.com,release-assets.githubusercontent.com}"
      # The chat kill switch (§4.8): the watchdog writes host names into this file; the proxy
      # refuses them from then on, open tunnels included.
      QA_EGRESS_DENY_FILE: /qa/switch/deny
      QA_EGRESS_LOG: /qa/log/qa-egress.jsonl
    volumes:
      - ${QA_TOOL_DIR:?QA_TOOL_DIR must be set in the QA env file}/scripts/qa/fence:/qa/fence:ro
      - ${QA_HOME:?QA_HOME must be set in the QA env file}/state/egress:/qa/switch:ro
      - ${QA_HOME:?QA_HOME must be set in the QA env file}/logs/qa-egress:/qa/log
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require("net").connect(3128,"127.0.0.1").on("connect",()=>process.exit(0)).on("error",()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      default: { gw_priority: 100 }
      egress: {}

networks:
  # Docker's default address pools are exhausted on this machine (every 172.x/16 and 192.168.x/20
  # block is held by another stand), so every network here names its own subnet.
  default:
    ipam:
      config: [{ subnet: "10.233.36.0/24" }]
  egress:
    ipam:
      config: [{ subnet: "10.233.37.0/24" }]
  docker-api:
    ipam:
      config: [{ subnet: "10.233.38.0/24" }]
  tracy:
    internal: true
